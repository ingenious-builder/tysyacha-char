<!doctype html><html lang="ru"><head><meta charset="utf-8">
<script>
// Вариант из адреса: ?cover=0 — без viewport-fit=cover; ?fixed=1 — html/body position:fixed (как в старой игре)
var Q=new URLSearchParams(location.search),COVER=Q.get('cover')!=='0',FIXED=Q.get('fixed')==='1';
document.write('<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no'+(COVER?',viewport-fit=cover':'')+'">');
</script>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Тест экрана"><meta name="theme-color" content="#0d1120">
<link rel="manifest" href="vt.webmanifest"><link rel="apple-touch-icon" href="../icons/icon-192.png">
<title>Тест экрана</title>
<style>
/* Фон страницы — малиновый: где малиновое, там окно браузера есть, но столбики не дотянулись.
   Жёлтый — цвет окна приложения из манифеста (если полоса жёлтая — это уже не страница). */
html{background:#e0109a;height:100%}
body{margin:0;height:100%;font:600 12px/1.25 -apple-system,system-ui,sans-serif;color:#fff;overflow:hidden}
.c{position:absolute;top:0;width:calc(100% / 7);box-sizing:border-box;border-right:1px solid rgba(0,0,0,.35);display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center}
.c b{display:block;padding-top:150px;font-size:13px}.c i{font-style:normal;background:rgba(0,0,0,.55);padding:2px 3px;margin-bottom:2px;border-radius:3px}
#A{left:0;position:fixed;top:0;bottom:0;background:#1e6bd6}
#B{left:calc(100%/7*1);height:100vh;background:#18a058}
#C{left:calc(100%/7*2);height:100dvh;background:#c98a10}
#D{left:calc(100%/7*3);height:100lvh;background:#7a3fd1}
#E{left:calc(100%/7*4);height:100svh;background:#16a3b8}
#F{left:calc(100%/7*5);background:#c43a2e}
#G{left:calc(100%/7*6);background:#555}
#info{position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 330px);background:rgba(0,0,0,.78);padding:10px 12px;border-radius:10px;font:500 13px/1.4 ui-monospace,Menlo,monospace;white-space:pre-wrap;z-index:5}
#nav{position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 260px);display:flex;flex-wrap:wrap;gap:6px;z-index:6}
#nav a{flex:1 1 40%;text-align:center;color:#111;background:#ffe27a;border-radius:8px;padding:8px 4px;text-decoration:none;font:700 12px system-ui}
#nav a.on{background:#fff;outline:3px solid #000}
#p1,#p2{position:absolute;visibility:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
</style></head><body>
<div class="c" id="A"><b>A<br>fixed<br>0..0</b><i id="hA"></i></div>
<div class="c" id="B"><b>B<br>100vh</b><i id="hB"></i></div>
<div class="c" id="C"><b>C<br>100dvh</b><i id="hC"></i></div>
<div class="c" id="D"><b>D<br>100lvh</b><i id="hD"></i></div>
<div class="c" id="E"><b>E<br>100svh</b><i id="hE"></i></div>
<div class="c" id="F"><b>F<br>screen</b><i id="hF"></i></div>
<div class="c" id="G"><b>G<br>inner</b><i id="hG"></i></div>
<div id="nav"></div><pre id="info"></pre><div id="p1"></div>
<script>
if(FIXED){var st=document.createElement('style');st.textContent='html,body{position:fixed;top:0;left:0;right:0;bottom:0;width:100%}';document.head.appendChild(st);}
var V=[['cover=1&fixed=0','1) обычный'],['cover=0&fixed=0','2) без cover'],['cover=1&fixed=1','3) как старая игра'],['cover=0&fixed=1','4) без cover + fixed']];
var cur='cover='+(COVER?1:0)+'&fixed='+(FIXED?1:0);
document.getElementById('nav').innerHTML=V.map(function(v){return '<a href="./?'+v[0]+'" class="'+(v[0]===cur?'on':'')+'">'+v[1]+'</a>';}).join('');
function px(id){return Math.round(document.getElementById(id).getBoundingClientRect().height);}
function upd(){
  document.getElementById('F').style.height=screen.height+'px';document.getElementById('G').style.height=innerHeight+'px';
  ['A','B','C','D','E','F','G'].forEach(function(k){document.getElementById('h'+k).textContent=px(k);});
  var p=getComputedStyle(document.getElementById('p1')),vv=window.visualViewport;
  var ios=(navigator.userAgent.match(/OS (\d+)_(\d+)/)||[]).slice(1).join('.'),saf=(navigator.userAgent.match(/Version\/([\d.]+)/)||[])[1];
  document.getElementById('info').textContent=
    'вариант: '+cur+'\n'+
    'inner '+innerWidth+'×'+innerHeight+'  outer '+outerWidth+'×'+outerHeight+'\n'+
    'visualViewport '+(vv?Math.round(vv.height)+' top '+Math.round(vv.offsetTop):'—')+'\n'+
    'screen '+screen.width+'×'+screen.height+'  avail '+screen.availHeight+'\n'+
    'doc clientHeight '+document.documentElement.clientHeight+'\n'+
    'safe top '+p.paddingTop+'  bottom '+p.paddingBottom+'\n'+
    'standalone '+(navigator.standalone===true)+'  display-mode '+(matchMedia('(display-mode: standalone)').matches?'standalone':matchMedia('(display-mode: fullscreen)').matches?'fullscreen':'browser')+'\n'+
    'iOS(UA) '+ios+'  Safari '+saf+'  dpr '+devicePixelRatio;
}
upd();addEventListener('resize',upd);if(window.visualViewport)visualViewport.addEventListener('resize',upd);setTimeout(upd,500);setTimeout(upd,1500);
</script></body></html>
